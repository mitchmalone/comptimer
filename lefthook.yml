# Hooks are fast feedback; CI is the gate. Don't bypass with --no-verify.
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: '*.{ts,tsx,js,jsx,json,md,yml,yaml,css,html}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
